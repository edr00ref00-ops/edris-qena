<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>متجر إدريس</title>
<style>body{font-family:Tahoma;margin:0;background:#f2f2f2}header{background:#111;color:#fff;text-align:center;padding:15px}input{width:90%;display:block;margin:12px auto;padding:12px;border-radius:10px;border:1px solid #ccc}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{background:#fff;border-radius:12px;padding:10px}.card img{width:100%;height:130px;object-fit:cover;border-radius:8px}.price{color:green;font-weight:bold}.btn{display:block;background:#25D366;color:#fff;text-align:center;padding:10px;border-radius:8px;text-decoration:none;margin-top:8px}.call{display:block;background:#111;color:#fff;text-align:center;padding:10px;border-radius:8px;text-decoration:none;margin-top:6px}.topcall{display:inline-block;background:#fff;color:#111;padding:8px 20px;border-radius:20px;text-decoration:none;font-weight:bold;margin-top:10px}</style>
</head>
<body>
<header><h1>متجر إدريس 🏪</h1><a class="topcall" href="tel:+201119779356">📞 اتصل بينا الآن</a></header>
<input id="q" placeholder="دور على صنف..." oninput="render()">
<div class="grid" id="grid"><p>جاري التحميل...</p></div>
<script>
const CALL="201119779356";
const WA="201093325276";
const URL="https://docs.google.com/spreadsheets/d/1oMmMQajIGqrRRrAwzrurB2c1FxoELQUz3VNXPpR11Yg/gviz/tq?tqx=out:csv&sheet=Sheet1";
let all=[];
function parse(t){let r=[],row=[],c="",q=false;for(let i=0;i<t.length;i++){let ch=t[i];if(ch=='"'){if(q&&t[i+1]=='"'){c+='"';i++}else q=!q}else if(ch==','&&!q){row.push(c);c=""}else if(ch=='\n'&&!q){row.push(c);r.push(row);row=[];c=""}else if(ch!='\r')c+=ch}row.push(c);r.push(row);return r}
async function load(){let res=await fetch(URL);let txt=await res.text();let rows=parse(txt);all=rows.slice(1).filter(x=>x[0]).map(x=>({name:x[0],price:x[1],img:x[2],cat:x[3]}));render()}
function render(){let q=document.getElementById("q").value.toLowerCase();let list=all.filter(p=>p.name.toLowerCase().includes(q));document.getElementById("grid").innerHTML=list.map(p=>`<div class="card"><img src="${p.img||'https://placehold.co/600x400?text=Edris'}"><h3>${p.name}</h3><div class="price">${p.price} جنيه</div><div>${p.cat||''}</div><a class="btn" href="https://wa.me/${WA}?text=${encodeURIComponent('عايز: '+p.name)}">اطلب واتساب</a><a class="call" href="tel:+${CALL}">📞 اتصال</a></div>`).join("")}
load();
</script>
</body>
</html>
