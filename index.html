<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجر إدريس - قنا</title>
<style>
*{box-sizing:border-box;font-family:Tahoma,sans-serif}
body{margin:0;background:#f4f4f4}
header{background:#111;color:#fff;padding:15px;text-align:center;position:relative}
header img{width:90px;height:90px;border-radius:50%;object-fit:cover;background:#fff;border:3px solid #ffcc00}
header h1{margin:5px 0 0;font-size:22px}
.addr{margin:8px auto 0;display:inline-block;background:linear-gradient(90deg,#ffcc00,#ff9900);color:#111;padding:6px 14px;border-radius:20px;font-weight:900;font-size:14px}
.maint{margin:7px auto 0;display:block;color:#00e5ff;font-weight:bold;font-size:14px;text-shadow:0 0 10px #00e5ff}
.dev{position:absolute;top:14px;left:8px;text-align:center;line-height:1.9}
.dev b{color:#fff;font-size:18px;font-weight:900;display:block;text-shadow:0 0 10px #fff}
.dev a{display:block;direction:ltr;font-weight:900;font-size:14px;text-decoration:none;animation:glow 1.3s infinite alternate}
.dev a:first-of-type{color:#00e5ff}
.dev a:last-of-type{color:#ff4d6d}
@keyframes glow{from{opacity:.65;text-shadow:0 0 4px currentColor}to{opacity:1;text-shadow:0 0 12px currentColor,0 0 22px currentColor}}
.basmala{position:absolute;top:12px;right:8px;width:105px;text-align:center;line-height:1.7;background:rgba(255,204,0,.12);border:1px solid #ffcc00;border-radius:12px;padding:7px 5px;box-shadow:0 0 14px rgba(255,204,0,.5);animation:goldGlow 1.6s infinite alternate}
.basmala span{display:block;font-size:12px;font-weight:900;color:#ffcc00;text-shadow:0 0 10px #ffcc00}
@keyframes goldGlow{from{box-shadow:0 0 5px rgba(255,204,0,.4)}to{box-shadow:0 0 18px rgba(255,204,0,.9)}}
.top-btns{display:flex;gap:10px;justify-content:center;padding:12px}
.top-btns a{flex:1;text-align:center;padding:12px;border-radius:10px;color:#fff;text-decoration:none;font-weight:bold;font-size:15px}
.call{background:#007bff}
.wa{background:#25D366}
.search{padding:0 12px}
.search input{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;font-size:15px}
#products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1);text-align:center;padding-bottom:10px}
.card img{width:100%;height:150px;object-fit:cover;background:#eee}
.card h3{font-size:14px;margin:8px 5px;min-height:35px}
.price{color:#d00;font-weight:bold;font-size:16px}
.wholesale{background:#111;color:#ffcc00;font-weight:900;font-size:14px;padding:6px;margin:5px 10px;border-radius:8px;display:none}
body.admin .wholesale{display:block}
.card .order-btn{display:block !important;background:#25D366 !important;color:#fff !important;text-decoration:none !important;margin:10px;padding:11px;border-radius:10px;font-size:15px;font-weight:900}
.admin-wrap{padding:10px 12px 5px}
.admin-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#111;color:#fff;border:2px solid #ffcc00;padding:16px;border-radius:15px;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,.3)}
.admin-btn span{font-size:26px}
body.admin .admin-btn{background:#ffcc00;color:#111}
footer{text-align:center;padding:15px;color:#888;font-size:13px}
</style>
</head>
<body>
<header>
<div class="dev">
<b>هادي</b>
<a href="tel:01006576081">01006576081</a>
<a href="tel:01116953202">01116953202</a>
</div>
<div class="basmala">
<span>🤲 بسم الله</span>
<span>كل ما بدأ</span>
<span>بغير اسم الله</span>
<span>فهو ناقص</span>
</div>
<img src="logo.png.jpeg" alt="متجر إدريس">
<h1>متجر إدريس</h1>
<div class="addr">📍 قنا - أبوتشت - العمرة</div>
<div class="maint">⚙️ لقطع غيار وصيانة الأجهزة المنزلية ⚙️</div>
</header>
<div class="top-btns">
<a class="call" href="tel:01119779356">📞 اتصل بنا</a>
<a class="wa" href="https://wa.me/201093325276">💬 واتساب</a>
</div>
<div class="search"><input id="search" placeholder="دور على منتج... ثلاجة، خلاط، فلتر" oninput="filter()"></div>
<div class="admin-wrap">
<button class="admin-btn" id="adminBtn" onclick="adminLogin()"><span>⚙️</span> دخول الأدمن - إظهار سعر الجملة <span>🔒</span></button>
</div>
<div id="products">جاري تحميل الأصناف...</div>
<footer>متجر إدريس © 2026 - قنا</footer>
<script>
let all=[];
let isAdmin = localStorage.getItem('isAdmin')==='1';
if(isAdmin){document.body.classList.add('admin');}
function updateBtn(){
let b=document.getElementById('adminBtn');
if(document.body.classList.contains('admin')){b.innerHTML='<span>⚙️</span> وضع الأدمن شغال ✅ - اضغط للخروج <span>🔓</span>';}
}
updateBtn();
function adminLogin(){
if(document.body.classList.contains('admin')){
localStorage.removeItem('isAdmin');
document.body.classList.remove('admin');
document.getElementById('adminBtn').innerHTML='<span>⚙️</span> دخول الأدمن - إظهار سعر الجملة <span>🔒</span>';
show(all); return;
}
let p = prompt('اكتب كلمة سر الأدمن:');
if(p==='0100'){
localStorage.setItem('isAdmin','1');
document.body.classList.add('admin');
updateBtn();
alert('تم تفعيل وضع الأدمن ✅ سعر الجملة هيظهر ليك دلوقتي');
show(all);
}else{alert('كلمة السر غلط');}
}
fetch('https://docs.google.com/spreadsheets/d/1oMmMQajIGqrRRrAwzrurB2c1FxoELQUz3VNXPpR11Yg/gviz/tq?tqx=out:json')
.then(r=>r.text()).then(t=>{
let j=JSON.parse(t.substring(47).slice(0,-2));
let rows=j.table.rows;
all=rows.map(r=>({name:r.c[0]?.v||'',price:r.c[1]?.v||'',img:r.c[2]?.v||'',cat:r.c[3]?.v||'',wholesale:r.c[4]?.v||''})).filter(x=>x.name);
show(all);
});
function show(list){
document.getElementById('products').innerHTML=list.map(p=>`
<div class="card">
<img src="${p.img||'https://via.placeholder.com/300'}" onerror="this.src='https://via.placeholder.com/300'">
<h3>${p.name}</h3>
<div class="price">${p.price} جنيه</div>
${p.wholesale?`<div class="wholesale">سعر الجملة: ${p.wholesale} جنيه 🔒</div>`:''}
<a class="order-btn" href="https://wa.me/201093325276?text=${encodeURIComponent('عايز اطلب: '+p.name+' - '+p.price+' جنيه')}">اطلب واتساب</a>
</div>`).join('')||'مفيش منتجات';
}
function filter(){
let q=document.getElementById('search').value;
show(all.filter(p=>p.name.includes(q)));
}
</script>
</body>
</html>
